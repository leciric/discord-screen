# nginx da Sala de Tela. Vai para /etc/nginx/sites-available/ e é ligado por
# link em sites-enabled/ — veja docs/vps.md.
#
# O domínio precisa estar em DNS only (nuvem cinza) na Cloudflare. O proxy
# deles no plano gratuito não é para tráfego de vídeo, e este servidor é um
# relay: os quadros codificados sobem pelo WebSocket de /ws e saem por ele
# para cada espectador.

# ACME e redirecionamento. A porta 80 continua aberta depois do certificado
# emitido porque é por ela que a renovação do Let's Encrypt acontece.
server {
    listen 80;
    listen [::]:80;
    server_name seesee.linting.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seesee.linting.dev;

    ssl_certificate     /etc/letsencrypt/live/seesee.linting.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seesee.linting.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nada de X-Frame-Options aqui. O Discord embute a Activity num iframe, e
    # foi justamente esse header — carimbado por uma borda de PaaS — que
    # deixava a tela em branco sem erro nenhum no log (docs/vps.md).

    # O relay de vídeo. Sem o Upgrade/Connection o WebSocket nunca sai do
    # handshake, e o sintoma é uma sala que abre e nunca recebe quadro.
    location /ws {
        proxy_pass http://127.0.0.1:31415;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uma transmissão fica horas aberta e é normal ela passar minutos sem
        # tráfego (tela parada gera pouco quadro). Com o timeout padrão de 60s
        # o nginx derruba a conexão no meio da apresentação.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Buffer desligado: segurar quadro aqui só acrescenta atraso ao que já
        # é ao vivo, e faz o nginx crescer em memória junto com o vídeo.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:31415;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
